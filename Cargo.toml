[package]
name = "anathema"
edition = "2024"
version = "0.2.12-beta"
license = "MIT"
description = "Create beautiful, easily customisable terminal applications"
keywords = ["tui", "terminal", "widgets", "ui", "layout"]
categories = ["command-line-interface"]
readme = "./README.md"
documentation = "https://togglebyte.github.io/anathema-guide/"
homepage = "https://github.com/togglebyte/anathema"
repository = "https://github.com/togglebyte/anathema"
publish = true
rust-version = "1.88"

[dependencies]
anathema-compiler = { workspace = true }
anathema-core = { workspace = true }
anathema-frontend = { workspace = true }
anathema-geometry = { workspace = true }
anathema-runtime = { workspace = true }
anathema-state-derive = { workspace = true }
anathema-store = { workspace = true }
anathema-strings = { workspace = true }
anathema-widgets = { workspace = true }

[features]
default = ["anathema-frontend/crossterm", "anathema-frontend/wgpu"]
profile = []
multithread = ["anathema-core/multithread", "anathema-runtime/multithread"]
serde = ["anathema-store/serde", "anathema-compiler/serde"]
wgpu = ["anathema-frontend/wgpu"]
crossterm = ["anathema-frontend/crossterm"]

[lints]
workspace = true

[workspace.package]
edition = "2024"
version = "0.2.12-beta"

[workspace.dependencies]
bitflags = "2.4.1"
bytemuck = { version = "1.24.0", features = ["derive"] }
flume = "0.11.0"
nohash-hasher = "0.2.0"
notify = "6.1.1"
unicode-width = "0.1.11"
anathema-compiler = { path = "./anathema-compiler", version = "0.2.12-beta" }
anathema-core = { path = "./anathema-core", version = "0.2.12-beta" }
anathema-frontend = { path = "./anathema-frontend", version = "0.2.12-beta" }
anathema-geometry = { path = "./anathema-geometry", version = "0.2.12-beta" }
anathema-runtime = { path = "./anathema-runtime", version = "0.2.12-beta" }
anathema-state-derive = { path = "./anathema-state-derive", version = "0.2.12-beta" }
anathema-store = { path = "./anathema-store", version = "0.2.12-beta" }
anathema-strings = { path = "./anathema-strings", version = "0.2.12-beta" }
anathema-widgets = { path = "./anathema-widgets", version = "0.2.12-beta" }

[workspace]
members = [
    "anathema-compiler", 
    "anathema-core", 
    "anathema-frontend", 
    "anathema-geometry", 
    "anathema-runtime",
    "anathema-state-derive",
    "anathema-store",
    "anathema-strings", 
    "anathema-widgets", 
]

[workspace.lints.rust]
rust_2018_idioms = "deny"

[workspace.lints.clippy]
from_over_into = "allow"
len_without_is_empty = "allow"
new_without_default = "allow"
should_implement_trait = "allow"
type_complexity = "allow"
too_many_arguments = "allow"
wrong_self_convention = "allow"
collapsible_if = "allow"

[package.metadata.release]
shared-version = true
dependent-version = "upgrade"
