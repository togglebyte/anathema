[package]
name = "anathema-frontend"
edition.workspace = true
version.workspace = true

[dependencies]
anathema-geometry = { workspace = true }
anathema-hashmap = { workspace = true }
anathema-store = { workspace = true }
arrayvec = "0.7.6"
bytemuck = { workspace = true }
crossterm = { version = "0.29.0", optional = true }
glam = { workspace = true }
image = { version = "0.25.8", optional = true }
pollster = { version = "0.4.0", optional = true }
unicode-normalization = "0.1.25"
unicode-segmentation = "1.12.0"
unicode-width.workspace = true
wgpu = { version = "27.0.1", optional = true }
winit = { version = "0.30.12", features = ["rwh_06"] }

[features]
default = ["crossterm", "wgpu"]
crossterm = ["dep:crossterm"]
wgpu = ["dep:wgpu", "dep:image", "dep:pollster"]

[lints]
workspace = true
